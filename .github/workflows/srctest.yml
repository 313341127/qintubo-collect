name: src-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_sources.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - run: python test_sources.py
