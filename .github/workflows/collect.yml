name: collect

on:
  # schedule 已临时禁用（Turso 免费写入配额 9 月已耗尽，空跑无意义，等 10/1 配额重置后再启用）
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  actions: write   # 允许采集脚本云端自接力(dispatch 下一轮)
  contents: read   # checkout 需要读取仓库

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pymysql -q
      - run: python collect.py
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: '4000'
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PWD: ${{ secrets.TIDB_PWD }}
          TIDB_DB: 'qintubo'
          GH_REPO: '313341127/qintubo-collect'
          GH_PAT: ${{ secrets.GH_PAT }}
          TIME_LIMIT: '1800'
          MAX_PAGES: '1000'
