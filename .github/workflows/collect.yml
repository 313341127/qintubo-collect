name: collect

on:
  schedule:
    - cron: '0 */12 * * *'   # 每12小时一次兜底（控制 GitHub Actions 免费额度）
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  actions: write   # 允许采集脚本云端自接力(dispatch 下一轮)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - run: python collect.py
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          GH_REPO: '313341127/qintubo-collect'
          TIME_LIMIT: '1800'
          MAX_PAGES: '1000'
